# Secure delivery pipeline (Agile-DevSecOps, see docs/SDLC.md). Runs the
# same gates as `python backend/scripts/gates.py` locally, on every push and PR.
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix frontend
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python backend/scripts/gates.py
